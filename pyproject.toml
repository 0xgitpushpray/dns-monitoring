[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsmon"
dynamic = ["version"]
description = "Lightweight local DNS monitoring: watch records across resolvers and get alerted on failures and changes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["dnspython>=2.4"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dnsmon = "dnsmon.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dnsmon.__version__" }

[tool.setuptools.packages.find]
include = ["dnsmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
